<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlyBy Carport Inspection</title>
<style>
  :root { color-scheme: dark; --bg:#111914; --panel:#19231b; --line:#344337; --ink:#e8eee7; --muted:#9fb09c; --accent:#b5cf89; --bad:#ef6a5b; --act:#e0a33c; --good:#6cc48a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 Inter, "Segoe UI", Arial, sans-serif; }
  main { display:grid; grid-template-columns: minmax(0,1fr) 320px; gap:16px; padding:16px; height:100vh; }
  #view { width:100%; height:100%; display:block; border:1px solid var(--line); border-radius:10px; background:#0b100d; }
  aside { display:flex; flex-direction:column; gap:14px; overflow:auto; }
  h1 { font-size:18px; margin:0; letter-spacing:.02em; }
  .controls { display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
  label { display:grid; gap:4px; font-size:12px; color:var(--muted); }
  select, input[type=number] { background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:6px; }
  .toggle { display:flex; align-items:center; gap:8px; grid-column: span 2; color:var(--ink); font-size:13px; }
  button { grid-column: span 2; background:var(--accent); color:#10160f; border:0; border-radius:6px; padding:10px; font-weight:700; cursor:pointer; }
  #fpv { width:100%; aspect-ratio:1; image-rendering:pixelated; border:1px solid var(--line); border-radius:8px; background:#000; }
  .cap { font-size:12px; color:var(--muted); margin:-8px 0 0; }
  #hud { display:grid; gap:4px; font-variant-numeric: tabular-nums; }
  .state { font-weight:700; font-size:16px; padding:6px 10px; border-radius:6px; background:var(--panel); border:1px solid var(--line); text-transform:uppercase; letter-spacing:.04em; }
  .state.act { background:var(--act); color:#1b1307; } .state.bad { background:var(--bad); color:#fff; } .state.good { background:var(--good); color:#0d1b12; }
  .row { display:flex; justify-content:space-between; border-bottom:1px solid var(--line); padding:3px 0; }
  .row span { color:var(--muted); }
  .bar { position:relative; height:8px; background:var(--panel); border-radius:4px; overflow:hidden; }
  .bar i { position:absolute; inset:0 auto 0 0; background:var(--accent); }
  .bar em { position:absolute; top:0; bottom:0; width:2px; background:var(--act); }
  #error { color:var(--bad); font-size:12px; margin:0; }
  footer { font-size:11px; color:var(--muted); }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; height:auto; } #view { height:60vh; } }
</style>
</head>
<body>
<main>
  <canvas id="view"></canvas>
  <aside>
    <h1>Carport inspection</h1>
    <div class="controls">
      <label>Scenario<select id="scenario"></select></label>
      <label>Seed<input id="seed" type="number" value="0" min="0"></label>
      <label>Camera FOV<select id="fov"><option value="120">120°</option><option value="90">90°</option><option value="60">60°</option></select></label>
      <label class="toggle"><input id="reflex" type="checkbox" checked> Fly reflex on</label>
      <button id="start" type="button">Fly</button>
    </div>
    <p id="error"></p>
    <canvas id="fpv" width="288" height="288"></canvas>
    <p class="cap">Drone camera: the exact 96 × 96 frames sent to the fly eye.</p>
    <div id="hud"></div>
    <footer>Fly eye: pretrained flyvis model. Looming units, brake, saccade and goal steering are engineered fly-inspired layers. The threshold may be uncalibrated; see /health.</footer>
  </aside>
</main>
<script type="module" src="/src/inspect-page.ts"></script>
</body>
</html>
