<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlyBy Carport Inspection</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#111914; color:#e8eee7; font:14px/1.45 Inter, "Segoe UI", Arial, sans-serif; }
  main { display:grid; grid-template-columns: 260px minmax(0,1fr); gap:16px; padding:16px; min-height:100vh; box-sizing:border-box; }
  #stage { min-height: 70vh; }
  h1 { font-size:18px; margin:0 0 10px; }
  .controls { display:grid; gap:8px; }
  label { display:grid; gap:4px; font-size:12px; color:#9fb09c; }
  .toggle { display:flex; gap:8px; align-items:center; color:#e8eee7; }
  select, input[type=number] { background:#19231b; color:#e8eee7; border:1px solid #344337; border-radius:6px; padding:6px; }
  button { background:#b5cf89; color:#10160f; border:0; border-radius:6px; padding:10px; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  #error { color:#ef6a5b; font-size:12px; }
  pre { font-size:11px; white-space:pre-wrap; color:#9fb09c; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <aside>
    <h1>Carport inspection</h1>
    <div class="controls">
      <label>Scenario<select id="scenario"></select></label>
      <label>Seed<input id="seed" type="number" value="0" min="0"></label>
      <label>Camera FOV<select id="fov"><option value="90">90°</option><option value="120">120°</option><option value="60">60°</option></select></label>
      <label class="toggle"><input id="reflex" type="checkbox" checked> Fly reflex on</label>
      <label class="toggle"><input id="person" type="checkbox" checked> Person under the roof</label>
      <button id="start" type="button">Fly</button>
    </div>
    <p id="error"></p>
    <pre id="result"></pre>
  </aside>
  <div id="stage"></div>
</main>
<script type="module" src="/src/inspect-page.ts"></script>
</body>
</html>
