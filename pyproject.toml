[project]
name = "flyby-triage"
version = "0.1.0"
description = "Local drone search-and-rescue triage simulator"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pydantic-settings",
  "numpy",
  "pandas",
  "pyarrow",
  "matplotlib",
  "pymongo",
  "python-dotenv",
  "httpx",
  "pytest",
  "pytest-asyncio",
  "xai-sdk",
  "laya==0.3.20",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["slow: loads the local model", "network: requires external services"]
